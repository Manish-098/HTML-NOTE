<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Type</title>
  </head>
  <body>
    <h1>Addmission Form</h1>
    <form action="demo.html">
      <label for="user">Name</label>
      <input type="text" name="user" id="user" autofocus /><br /><br />
      <label for="fname">Father's Name </label>
      <input type="text" name="fname" id="fname" /><br /><br />
      <label for="mname">Mother's Name</label>
      <input type="text" name="mname" id="mname" /><br /><br />
      <label for="pass">Password</label>
      <input type="password" name="pass" id="pass" /><br /><br />
      Gender:
      <label> <input type="radio" name="Gender" />Male</label>
      <label><input type="radio" name="Gender" />Famale</label>
      <label><input type="radio" name="Gender" />Other</label><br /><br />
      Hobbies:
      <label> <input type="checkbox" name="hob" />Chess </label>
      <label><input type="checkbox" name="hob" />Cricket</label>
      <label><input type="checkbox" name="hob" />Reading Book</label
      ><br /><br />
      <label> Email: <input type="email" name="email" /> </label><br /><br />
      <label>Choose Photo: <input type="file" name="file" /></label><br /><br />
      <label> <input type="hidden" name="hide" /> </label>
      <label> Age: <input type="number" name="num" /> </label><br /><br />
      <label> Search: <input type="search" name="search" /> </label><br /><br />
      <label>Phone <input type="tel" name="phone" /></label><br /><br />
      <label> Birth Time: <input type="time" name="time" /> </label><br /><br />
      <label>Birth Date: <input type="date" name="date" /></label><br /><br />
      <label>
        Range: <input type="range" name="range" min="10" max="200" /> </label
      ><br /><br />
      <label> Fav Color: <input type="color" name="col" /> </label><br /><br />

      <label
        >DateTime<input type="datetime-local" name="datetime" id="" /></label
      ><br /><br />

      <input type="submit" name="submit" value="submit" />
      <input type="reset" name="reset" />
    </form>
  </body>
</html>
